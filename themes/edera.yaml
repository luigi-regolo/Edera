Edera:
  modes:
    light:
      # ============================================================
      # EDERA - LIGHT
      # ============================================================

      # Typography
      ha-font-family-body: '-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
      ha-font-family-heading: '-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
      ha-font-weight-body: "400"
      ha-font-weight-heading: "600"
      ha-font-weight-action: "500"

      # ============================================================
      # Brand & Edera design tokens
      # ============================================================

      primary-color: "#064E3B"
      accent-color: "#F8E7C9"

      edera-emerald-color: "#0E6B52"
      edera-champagne-color: "#B98A45"
      edera-sage-color: "#789A8A"

      # Lights
      edera-light-color: "#9A7C4F"
      edera-light-active-color: "var(--edera-light-color)"
      edera-light-fill-color: "var(--edera-light-color)"

      edera-alert-color: "#B85D55"
      edera-warning-color: "#C89643"
      edera-battery-medium-color: "#B9965C"

      edera-media-color: "#3F7D70"

      edera-heat-color: "#C76F4F"
      edera-cool-color: "#4F8193"
      edera-fan-color: "#638F85"
      edera-neutral-state-color: "#858E89"

      edera-alarm-armed-color: "#B8544A"
      edera-alarm-triggered-color: "#C93D32"

      edera-on-accent-color: "#FFFFFF"

      orange-color: "var(--edera-alert-color)"

      # ============================================================
      # Bubble Card
      # ============================================================

      bubble-accent-color: "#0E6B52"
      bubble-main-background-color: "#F1F3EF"
      bubble-secondary-background-color: "#FFFFFF"

      bubble-light-color: "var(--edera-light-color)"
      bubble-light-white-color: "var(--edera-light-color)"

      bubble-border-radius: "25px"

      bubble-icon-border-radius: "999px"
      bubble-icon-background-color: "#FFFFFF"

      bubble-sub-button-border-radius: "18px"
      bubble-sub-button-background-color: "#FFFFFF"

      bubble-box-shadow: "none"
      bubble-border: "1px solid #E3E7E2"

      # ============================================================
      # Backgrounds & surfaces
      # ============================================================

      primary-background-color: "#FAFAF7"
      secondary-background-color: "#F1F3EF"
      card-background-color: "#FFFFFF"

      ha-color-surface-default: "#FFFFFF"
      ha-color-surface-low: "#F6F7F3"
      ha-color-surface-lower: "#EEF1ED"

      ha-color-surface-default-inverted: "#202622"
      ha-color-surface-low-inverted: "#181D1A"
      ha-color-surface-lower-inverted: "#111513"

      ha-card-border-radius: "22px"
      ha-card-border-width: "1px"
      ha-card-border-color: "#E3E7E2"
      ha-card-box-shadow: "0 6px 20px rgba(20, 37, 30, 0.05)"

      # ============================================================
      # Text
      # ============================================================

      primary-text-color: "#19221E"
      secondary-text-color: "#68716C"
      text-primary-color: "#FFFFFF"
      disabled-text-color: "#9BA19D"

      divider-color: "#E1E5E1"

      # ============================================================
      # Header
      # ============================================================

      app-header-background-color: "#FAFAF7"
      app-header-text-color: "#19221E"
      app-header-selection-bar-color: "#064E3B"
      app-header-edit-background-color: "#064E3B"
      app-header-edit-text-color: "#FFFFFF"

      # ============================================================
      # Sidebar
      # ============================================================

      sidebar-background-color: "#FAFAF7"
      sidebar-icon-color: "#68736E"
      sidebar-text-color: "#37403C"

      sidebar-selected-background-color: "#E8EFEA"
      sidebar-selected-icon-color: "#064E3B"
      sidebar-selected-text-color: "#064E3B"

      state-icon-color: "#7E8782"

      # ============================================================
      # Switches
      # ============================================================

      ha-switch-background-color: "#DDE2DE"
      ha-switch-thumb-background-color: "#AEB7B2"
      ha-switch-border-color: "#D0D6D2"
      ha-switch-thumb-border-color: "#AEB7B2"

      ha-switch-checked-background-color: "#064E3B"
      ha-switch-checked-border-color: "#064E3B"
      ha-switch-checked-thumb-background-color: "#AEB7B2"
      ha-switch-checked-thumb-border-color: "#AEB7B2"

      ha-switch-thumb-box-shadow: "none"

      # Checkboxes
      ha-checkbox-border-color: "#AEB7B2"
      ha-checkbox-background-color: "#FFFFFF"
      ha-checkbox-checked-background-color: "#064E3B"
      ha-checkbox-checked-icon-color: "#FFFFFF"

      # ============================================================
      # Edera Graph Palette
      # ============================================================

      graph-color-1: "#0E6B52"
      graph-color-2: "#3F7D70"
      graph-color-3: "#B98A45"
      graph-color-4: "#789A8A"
      graph-color-5: "#C76F4F"
      graph-color-6: "#4F8193"
      graph-color-7: "#C89643"
      graph-color-8: "#B85D55"
      graph-color-9: "#65746D"
      graph-color-10: "#4B8D86"
      graph-color-11: "#9B7C5D"
      graph-color-12: "#7D756B"

      # ============================================================
      # Semantic colors
      # ============================================================

      error-color: "#C95C4A"
      warning-color: "var(--edera-warning-color)"
      success-color: "#2F7A57"
      info-color: "#4F8193"

      # ============================================================
      # BATTERY
      # ============================================================

      state-sensor-battery-high-color: "var(--edera-emerald-color)"
      state-sensor-battery-medium-color: "var(--edera-battery-medium-color)"
      state-sensor-battery-low-color: "var(--edera-alarm-triggered-color)"

      # ============================================================
      # AUTOMATIONS / SCRIPTS
      # ============================================================

      state-automation-on-color: "var(--edera-emerald-color)"
      state-script-on-color: "var(--edera-emerald-color)"

      # ============================================================
      # LIGHTS
      # ============================================================

      state-light-active-color: "var(--edera-light-color)"
      state-light-on-color: "var(--edera-light-color)"

      # ============================================================
      # SWITCHES / DEVICES
      # ============================================================

      state-switch-active-color: "var(--edera-emerald-color)"
      state-switch-on-color: "var(--edera-emerald-color)"
      state-input_boolean-on-color: "var(--edera-emerald-color)"

      state-fan-active-color: "var(--edera-emerald-color)"
      state-fan-on-color: "var(--edera-emerald-color)"

      state-humidifier-on-color: "var(--edera-emerald-color)"

      # ============================================================
      # MEDIA
      # ============================================================

